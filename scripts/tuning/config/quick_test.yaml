# 快速测试配置 - 验证框架是否正常工作
#
# 只跑 10 题，3 个实验，预计 5 分钟完成
#
# 用途仅限「跑通流程」：10 题不足以支撑任何诊断结论
#（全量教训：40 题 F1=59.9%，全量 3610 题只有 47.0%）。
#
# ⚠️ 与 phase1_diagnosis.yaml 的关键差异：本配置**保留 skip_generation**（不跑生成），
#    为的是 5 分钟内验完流程。代价是没有 F1。
#
#    本配置的 post_process 只跑 γ sweep 这一个分析（不是完整的四个诊断），
#    而 γ sweep 容忍缺 F1：它会打印「⚠️ 无 F1 数据（--skip_generation），
#    结论仅覆盖检索侧」然后正常退出 0。所以 Step 2 不会因为缺 F1 报错。
#
#    但 10 题 + 无 F1 的结果**不足以支撑任何诊断结论**。
#    要拿真结论用 phase1_diagnosis.yaml（200 题、开生成、四个诊断都能出结论）。

name: "Quick Test (10 samples)"
description: "快速测试框架功能，只跑 10 题"
version: "1.0"

output_dir: "scratch/research/quick_test"

experiments:
  - name: "gamma_0.0"
    description: "纯质量"
    command: "python -m scripts.rag.eval_rag_refactored"
    args:
      corpus_mode: "wiki_dpr"
      dataset: "nq_open"
      max_samples: 10
      method: "qore"
      K: 5
      lam: 2.0
      gamma: 0.0
      direct_solve_max_n: 20
      use_answer_scorer: true
      seed: 42
      # 诊断脚本需要 question/selected_passages/matched_answers,
      # 缺了会直接报错退出(不再静默产出空报告)
      dump_passages: true
      skip_generation: true
      output_dir: "{output_dir}/experiments/gamma_0.0"
      output_file: "result.json"
    expected_time_minutes: 2

  - name: "gamma_0.5"
    description: "平衡"
    command: "python -m scripts.rag.eval_rag_refactored"
    args:
      corpus_mode: "wiki_dpr"
      dataset: "nq_open"
      max_samples: 10
      method: "qore"
      K: 5
      lam: 2.0
      gamma: 0.5
      direct_solve_max_n: 20
      use_answer_scorer: true
      seed: 42
      # 诊断脚本需要 question/selected_passages/matched_answers,
      # 缺了会直接报错退出(不再静默产出空报告)
      dump_passages: true
      skip_generation: true
      output_dir: "{output_dir}/experiments/gamma_0.5"
      output_file: "result.json"
    expected_time_minutes: 2

  - name: "gamma_1.0"
    description: "纯多样性"
    command: "python -m scripts.rag.eval_rag_refactored"
    args:
      corpus_mode: "wiki_dpr"
      dataset: "nq_open"
      max_samples: 10
      method: "qore"
      K: 5
      lam: 2.0
      gamma: 1.0
      direct_solve_max_n: 20
      use_answer_scorer: true
      seed: 42
      # 诊断脚本需要 question/selected_passages/matched_answers,
      # 缺了会直接报错退出(不再静默产出空报告)
      dump_passages: true
      skip_generation: true
      output_dir: "{output_dir}/experiments/gamma_1.0"
      output_file: "result.json"
    expected_time_minutes: 2

post_process:
  analyze:
    enabled: true
    # 指向仓库内脚本（scratch/ 被 gitignore，合作者拉不到）
    script: "scripts/diagnosis/gamma_sweep_diagnosis.py"
    args:
      results_dir: "{output_dir}/experiments"
      output: "{output_dir}/analysis/gamma_sweep.md"

  package:
    enabled: true
    output: "{output_dir}/package/quick_test_{timestamp}.zip"
    include:
      - "{output_dir}/experiments/*/result.json"
      - "{output_dir}/analysis/*"
      - "{output_dir}/run_summary.json"

  visualize:
    enabled: false

execution:
  parallel: 1
  retry_on_failure: 1
  # 30 分钟不是「跑 10 题要 30 分钟」—— 计算本身只要几分钟，
  # 时间几乎全花在加载 wiki_dpr 索引和 DPR answer scorer 上。
  # 旧值 10 分钟没给加载留余量：一旦某个实验超时，retry 会让它白跑两遍共 20 分钟，
  # 然后 set -e 中止脚本，留下一份上一轮的陈 result.json —— Step 3 就会读到它。
  timeout_minutes: 30

  pre_checks:
    - check_gpu: true
    - check_disk_space_gb: 5
    - check_python_packages: ["torch", "transformers"]

notifications:
  enabled: false
