schema_version: 1

gate:
  name: five_idea_development_gate_smoke
  description: 20-question schema and runner smoke gate.
  shared_args:
    dataset: nq_open
    split: validation
    max_samples: 20
    corpus_mode: wiki_dpr
    K: 5
    lam: 2.0
    seed: 42
    dump_passages: true
  configurations:
    - name: qore_dpr
      kind: qore
      args: {method: qore, gamma: 0.5}
    - name: qore_as_control
      kind: qore
      args: {method: qore, gamma: 0.5, delta: 0.0, use_answer_scorer: true}
    - name: qore_as_idea6
      kind: qore
      args:
        method: qore
        gamma: 0.5
        delta: 0.1
        complementarity_method: dpr
        use_answer_scorer: true
    - name: topk_as
      kind: baseline
      args: {method: topk, use_answer_scorer: true}
    - name: mmr_as
      kind: baseline
      args: {method: mmr, lambda_mmr: 0.7, use_answer_scorer: true}
  paired_comparisons:
    - [qore_dpr, qore_as_control]
    - [qore_as_control, qore_as_idea6]
    - [qore_as_idea6, topk_as]
    - [qore_as_idea6, mmr_as]

cache_stats:
  available: false
  hits: null
  misses: null
  reason: Answer Scorer cache is not implemented in Phase 1
