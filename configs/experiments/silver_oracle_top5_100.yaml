  input_integrity:
    case_count: 100
    candidate_count: 5000
    direct_consensus_candidates: 289
    positive_consensus_candidates: 603
    cases_with_direct_consensus: 77
    cases_with_positive_consensus: 87

  membership_integrity:
    qore_common_order: {direct: 119, broad: 177}
    topk_common_order: {direct: 138, broad: 203}
    silver_oracle_common_order: {direct: 222, broad: 307}

  oracle_policy:
    k: 5
    judge_count: 3
    consensus_votes: 2
    priority: [direct_consensus, positive_consensus, answer_scorer_fill]
    positive_labels: [direct, partial]
    tie_break: [direct_votes, positive_votes, mean_confidence, answer_scorer_score, retrieved_rank, candidate_id]
    target_conditioned: true
    deployable: false

  comparison:
    arms: [qore_common_order, topk_common_order, silver_oracle_common_order]
    context_order: ascending_original_retrieval_rank
    generator_calls: 300
    reuse_stored_top50: true
    rerun_retrieval: false
    rerun_answer_scorer: false
    rerun_all_generation_arms: true

  generator:
    model_id: NousResearch/Meta-Llama-3-8B-Instruct
    revision: 53346005fb0ef11d3b6a83b12c895cca40156b6c
    max_new_tokens: 32
    decoding: greedy
    use_chat_template: true
    model_path_candidates: [models/llama3-8b]
    resolver_order: [cli_override, project_candidate, hf_cache]
    record_resolved_identity: true

  gates:
    paired_bootstrap_repetitions: 5000
    paired_bootstrap_seed: 20260912
    oracle_minus_qore_f1_delta_min: 0.03
    oracle_minus_qore_f1_ci95_lower_min: 0.0
    oracle_minus_qore_em_delta_min: 0.0
    oracle_minus_topk_f1_delta_min: 0.0
    positive_f1_case_count_min: 5

  outputs:
    root: exchange/five_ideas/silver_oracle_top5_100
    complete_files: [case_study.json, case_study.md]
    compact_files: [result.json, run_metadata.json, upload_manifest.json]
    complete_files_exchange_only: true
    github_max_bytes: 1048576
    forbidden_compact_fields: [question, passages, gold_answers, prediction, raw_prompt, prompt, text, token_ids, selected_ids, retrieved_ids]
