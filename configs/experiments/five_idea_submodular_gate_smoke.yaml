schema_version: 1

gate:
  name: five_idea_submodular_gate_smoke
  description: 20-question collaborator smoke gate for Submodular wiring.
  shared_args:
    dataset: nq_open
    split: validation
    max_samples: 20
    corpus_mode: wiki_dpr
    K: 5
    lam: 2.0
    seed: 42
    dump_passages: true
  configurations:
    - name: qore_as_control
      kind: qore
      args: {method: qore, gamma: 0.5, delta: 0.0, use_answer_scorer: true}
    - name: submodular_as
      kind: baseline
      args: {method: submodular, saturation_alpha: 1.0, lambda_submodular: 0.1, use_answer_scorer: true}
    - name: topk_as
      kind: baseline
      args: {method: topk, use_answer_scorer: true}
    - name: mmr_as
      kind: baseline
      args: {method: mmr, lambda_mmr: 0.7, use_answer_scorer: true}
  paired_comparisons:
    - [qore_as_control, submodular_as]
    - [qore_as_control, topk_as]
    - [qore_as_control, mmr_as]

cache_stats:
  available: false
  hits: null
  misses: null
  reason: Answer Scorer cache is not implemented in Phase 1
