schema_version: 1

gate:
  name: five_idea_spectral_dpp_gate_smoke
  description: 20-question collaborator smoke gate for Spectral/DPP wiring.
  shared_args:
    dataset: nq_open
    split: validation
    max_samples: 20
    corpus_mode: wiki_dpr
    K: 5
    lam: 2.0
    seed: 42
    dump_passages: true
  configurations:
    - name: qore_as_control
      kind: qore
      args: {method: qore, gamma: 0.5, delta: 0.0, use_answer_scorer: true}
    - name: spectral_dpp_as
      kind: baseline
      args: {method: spectral_dpp, dpp_quality_scale: 12.0, dpp_jitter: 1.0e-8, use_answer_scorer: true}
    - name: topk_as
      kind: baseline
      args: {method: topk, use_answer_scorer: true}
    - name: mmr_as
      kind: baseline
      args: {method: mmr, lambda_mmr: 0.7, use_answer_scorer: true}
  paired_comparisons:
    - [qore_as_control, spectral_dpp_as]
    - [qore_as_control, topk_as]
    - [qore_as_control, mmr_as]

cache_stats:
  available: false
  hits: null
  misses: null
  reason: Answer Scorer cache is not implemented in Phase 1
