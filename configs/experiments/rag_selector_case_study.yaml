phase:
  name: rag_selector_case_study
  schema_version: 1
  diagnostic_only: true
  selection_mutation: false
  authorization: implemented_observation_only

  dataset:
    name: nq_open
    split: validation
    parent_slice:
      sample_offset: 1950
      max_samples: 50
      slice: "nq_open validation[1950:2000]"
      fresh_slice: true
    selected_relative_positions: [0, 10, 20, 30, 40]
    selected_global_indices: [1950, 1960, 1970, 1980, 1990]

  retrieval:
    corpus_mode: wiki_dpr
    wiki_dpr_config: psgs_w100.nq.compressed
    nprobe: 64
    initial_top_k: 50
    one_retrieval_per_question: true

  answer_scorer:
    backend: dpr
    one_scoring_pass_per_question: true

  selectors:
    - id: qore_as
      method: qore
      K: 5
      num_reads: 100
      lam: 2.0
      seed: 42
      gamma: 1.0
      delta: 0.0
      complementarity_method: null
      direct_solve_max_n: 20
      qore_prefilter_size: null
    - id: topk_as
      method: topk
      K: 5
    - id: mmr_as
      method: mmr
      K: 5
      lambda_mmr: 0.7
    - id: submodular_as
      method: submodular
      K: 5
      saturation_alpha: 1.0
      lambda_submodular: 0.5
    - id: spectral_dpp_as
      method: spectral_dpp
      K: 5
      dpp_quality_scale: 2.0
      dpp_jitter: 1.0e-8

  generator:
    model_id: NousResearch/Meta-Llama-3-8B-Instruct
    revision: 53346005fb0ef11d3b6a83b12c895cca40156b6c
    max_new_tokens: 32
    decoding: greedy
    use_chat_template: true
    model_path_candidates:
      - models/llama3-8b
    resolver_order: [cli_override, project_candidate, hf_cache]
    record_resolved_identity: true

  outputs:
    root: exchange/five_ideas/rag_selector_case_study
    complete_files: [case_study.md, case_study.json]
    compact_files: [run_metadata.json, upload_manifest.json]
    complete_files_exchange_only: true
    forbidden_compact_fields:
      - question
      - passages
      - gold_answers
      - prediction
      - raw_prompt
      - prompt
      - text
      - token_ids
      - selected_ids
      - retrieved_ids
