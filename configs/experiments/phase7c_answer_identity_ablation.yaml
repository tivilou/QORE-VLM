phase:
  name: phase7c_answer_identity_ablation
  schema_version: 1
  dataset: nq_open
  split: validation
  sample_offset: 100
  max_samples: 50
  seeds: [42]
  corpus_mode: wiki_dpr
  wiki_dpr_config: psgs_w100.nq.compressed
  wiki_dpr_nprobe: 64
  top_k_retrieval: 50
  K_values: [5]
  selection_variants:
    - name: qore_answer
      method: qore
      score_signal: answer
      enhancers: [baseline]
      enhancer_configs:
        baseline: {gamma: 1.0}
    - name: topk_answer
      method: topk
      score_signal: answer
      enhancers: []
      enhancer_configs: {}
    - name: qore_agreement
      method: qore
      score_signal: answer
      enhancers: [baseline, answer_corroboration]
      enhancer_configs:
        baseline: {gamma: 1.0}
        answer_corroboration: {mode: agreement, strength: 0.25, normalization: baseline_rms}
    - name: qore_corroboration
      method: qore
      score_signal: answer
      enhancers: [baseline, answer_corroboration]
      enhancer_configs:
        baseline: {gamma: 1.0}
        answer_corroboration: {mode: corroboration, strength: 0.25, normalization: baseline_rms}
  answer_scorer_backend: dpr
  answer_top_m: 3
  max_answer_tokens: 10
  high_conflict_threshold: 0.25
  decisive_confidence_threshold: 0.5
  decisive_margin_threshold: 0.2
  max_new_tokens: 32
  generators:
    - name: reference
      model_path: /root/QORE-VLM/models/llama3-8b
  outputs:
    root: exchange/five_ideas/phase7c_answer_identity_ablation
